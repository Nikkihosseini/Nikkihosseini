name: Update GitHub Stats

on:
  schedule:
    - cron: '0 * * * *' # هر ساعت اجرا میشه
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate GitHub Stats
        env:
          TOKEN: ${{ secrets.PAT_1 }}
          USERNAME: Nikkihosseini
        run: |
          # Stats
          curl -H "Authorization: token $TOKEN" \
          "https://github-readme-stats.vercel.app/api?username=$USERNAME&show_icons=true&theme=default&count_private=true&include_all_commits=true" \
          -o stats.svg

          # Top Languages
          curl -H "Authorization: token $TOKEN" \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=$USERNAME&layout=compact" \
          -o top-langs.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "Update GitHub stats" || echo "No changes to commit"
          git push
